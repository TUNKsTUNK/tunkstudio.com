# Rebuilds the static per-page HTML (work/*.html, about.html, …) and
# sitemap.xml whenever site content changes, so edits made from Claude
# Design / chat stay indexable without running anything by hand.
name: prerender

on:
  push:
    branches: [main]
    paths: ['index.html', 'data.js', '_redirects', 'scripts/prerender.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 scripts/prerender.py
      - name: Commit generated pages
        run: |
          git add -A work about.html press.html contact.html work.html sitemap.xml
          if git diff --cached --quiet; then echo "nothing to update"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "prerender: update static pages"
          git push
